<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>隔空控制器 · 工作台</title>
<meta name="description" content="隔空控制器工作台：眼动与手势测试台、视线热力图、GazeFollower 隔空画板和星际跑酷。">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' http://127.0.0.1:8899 ws://127.0.0.1:8899; frame-src 'self' http://127.0.0.1:8789; object-src 'none'; base-uri 'none'">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230c1410'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23a9db7b'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23a9db7b' stroke-opacity='.55' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=20261122e">
</head>
<body>
<div class="app">

  <main class="main">
    <header class="topbar">
      <button class="brand-mini" id="homeBtn" title="回到空间导航" aria-label="回到空间导航">
        <span class="logo" aria-hidden="true"><span class="ring"></span><span class="dot"></span></span>
        <b>隔空控制器</b>
      </button>
      <nav class="topnav" id="topnav" aria-label="模块导航"></nav>
      <span id="crumb" hidden></span>
      <div class="top-actions">
        <button class="btn ghost" id="gazeCalibBtn" title="用摄像头标定视线模型">标定视线</button>
        <span class="gaze-dot none" id="gazeModelDot" title="未标定" aria-label="未标定"></span>
        <span class="pill" id="backendPill">后端检测中</span>
        <button class="icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题">◐</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="empty" id="placeholder">
        <div class="empty-inner">
          <div class="spinner"></div>
          <p>正在加载模块注册表…</p>
        </div>
      </div>
    </div>
  </main>

  <aside class="rightbar" id="rightbar" hidden aria-label="模块操作">
    <div class="rb-actions">
      <button class="btn ghost" id="backBtn">返回导航</button>
      <button class="btn ghost" id="reloadBtn">重载</button>
      <button class="btn" id="openBtn">新标签打开</button>
    </div>
    <div class="rb-camera">
      <div class="rb-cam-head">摄像头预览 <span>LIVE</span></div>
      <div class="rb-cam-box">
        <canvas id="rbCamCanvas" width="400" height="225"></canvas>
        <div class="rb-cam-empty" id="rbCamEmpty">摄像头未开启<br><small>点顶栏「标定视线」启动</small></div>
      </div>
      <div class="rb-cam-foot" id="rbCamFoot">与标定同一路画面</div>
    </div>
  </aside>
</div>

<script src="../shared/gaze/audit-probe.js"></script>
<script src="app.js?v=20261122i"></script>
<script src="gaze-host.js?v=20261121f"></script>
</body>
</html>
