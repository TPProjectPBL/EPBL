<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MGazeNet 视线精度测试台</title>
<style>
:root{
  --bg:#070b12; --panel:#0f1828; --line:#1b2940; --txt:#e6edf7;
  --dim:#8b9bb4; --acc:#4f9cf9; --ok:#37d39b; --warn:#f5b942; --bad:#f2637e;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
  font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;
  border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.02em}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);
  color:var(--dim);background:#0b1420}
.pill.on{color:var(--ok);border-color:#1d5a48}
.pill.off{color:var(--bad);border-color:#5a2130}
main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,.85fr);
  gap:18px;padding:18px 20px;max-width:1500px;margin:0 auto}
@media(max-width:980px){main{grid-template-columns:1fr}}
.stage{position:relative;background:#000;border:1px solid var(--line);border-radius:12px;
  overflow:hidden;aspect-ratio:4/3}
.stage video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.dot{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;
  background:var(--acc);box-shadow:0 0 0 3px rgba(79,156,249,.22),0 0 18px rgba(79,156,249,.8);
  pointer-events:none;transition:opacity .12s}
.dot.lost{background:var(--dim);box-shadow:none;opacity:.35}
.hint{position:absolute;left:12px;bottom:12px;font-size:12px;color:var(--dim);
  background:rgba(7,11,18,.72);padding:4px 10px;border-radius:6px}
aside{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h2{font-size:13px;margin:0 0 10px;color:var(--dim);font-weight:500;letter-spacing:.06em}
.row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.row b{font-variant-numeric:tabular-nums}
button{appearance:none;border:1px solid var(--line);background:#13253c;color:var(--txt);
  padding:9px 14px;border-radius:8px;font-size:13px;cursor:pointer;transition:.15s}
button:hover{border-color:var(--acc);background:#16304f}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--acc);border-color:var(--acc);color:#04101f;font-weight:600}
button.ghost{background:transparent}
.actions{display:flex;flex-wrap:wrap;gap:8px}
pre{margin:8px 0 0;font-size:11.5px;line-height:1.5;color:var(--dim);white-space:pre-wrap;
  max-height:150px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.kpi div{background:#0b1420;border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}
.kpi span{display:block;font-size:11px;color:var(--dim)}
.kpi b{font-size:18px;font-variant-numeric:tabular-nums}
#overlay{position:fixed;inset:0;background:rgba(4,8,14,.94);z-index:50;display:none}
#overlay.show{display:block}
.target{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
  border:2px solid var(--acc);background:rgba(79,156,249,.18);
  box-shadow:0 0 0 8px rgba(79,156,249,.08)}
.target::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--acc)}
.target.done{border-color:var(--ok);background:rgba(55,211,155,.16)}
.target.done::after{background:var(--ok)}
.ovlabel{position:fixed;top:22px;left:50%;transform:translateX(-50%);font-size:13px;color:var(--dim)}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
  background:#13253c;border:1px solid var(--line);color:var(--txt);padding:9px 16px;
  border-radius:8px;font-size:13px;opacity:0;transition:.2s;z-index:80;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>MGazeNet 视线精度测试台</h1>
  <span class="pill" id="pCtx">context</span>
  <span class="pill" id="pSrv">未连接</span>
  <span class="pill" id="pCam">摄像头未启动</span>
  <span class="pill" id="pCal">未标定</span>
</header>

<main>
  <section class="stage" id="stage">
    <video id="cam" autoplay muted playsinline></video>
    <div class="dot lost" id="dot"></div>
    <div class="hint" id="hint">点「启动」授权摄像头；先标定，再做精度测试</div>
  </section>

  <aside>
    <div class="card">
      <h2>连接</h2>
      <div class="row"><span>推理网关</span><b id="vUrl">127.0.0.1:8901</b></div>
      <div class="row"><span>延迟</span><b id="vLat">— ms</b></div>
      <div class="row"><span>帧率</span><b id="vFps">— fps</b></div>
      <div class="row"><span>人脸</span><b id="vFace">—</b></div>
      <div class="actions" style="margin-top:10px">
        <button class="primary" id="btnStart">启动</button>
        <button class="ghost" id="btnStop" disabled>停止</button>
      </div>
      <pre id="log"></pre>
    </div>

    <div class="card">
      <h2>流程</h2>
      <div class="actions">
        <button id="btnCalib" disabled>13 点标定</button>
        <button id="btnTest" disabled>12 目标精度</button>
      </div>
      <div class="row" style="margin-top:8px"><span>标定样本</span><b id="vSamples">0</b></div>
      <div class="row"><span>训练误差</span><b id="vFit">—</b></div>
      <div class="row"><span>预测坐标</span><b id="vRaw">—</b></div>
    </div>

    <div class="card">
      <h2>精度结果</h2>
      <div class="kpi">
        <div><span>平均偏差</span><b id="kMean">—</b></div>
        <div><span>P90</span><b id="kP90">—</b></div>
        <div><span>命中率&lt;70px</span><b id="kHit">—</b></div>
      </div>
      <div class="actions" style="margin-top:10px">
        <button class="ghost" id="btnExport" disabled>导出 JSON</button>
      </div>
    </div>
  </aside>
</main>

<div id="overlay"><div class="ovlabel" id="ovLabel"></div></div>
<div id="toast"></div>

<script>
"use strict";
const WS_PORT = 8901;
const SCREEN = { w: 1920, h: 1080 };   // 与服务端 GAZE_SCREEN_W/H 保持一致
const CALIB = [
  [.10,.10],[.50,.10],[.90,.10],
  [.10,.50],[.50,.50],[.90,.50],
  [.10,.90],[.50,.90],[.90,.90],
  [.50,.30],[.30,.50],[.70,.50],[.50,.70],
];
const TARGETS = [];
for (const y of [.20,.50,.80]) for (const x of [.12,.38,.62,.88]) TARGETS.push([x,y]);

const $ = id => document.getElementById(id);
const video = $("cam"), dot = $("dot"), stage = $("stage");
const grab = document.createElement("canvas"); grab.width = 640; grab.height = 480;
const gctx = grab.getContext("2d", { willReadFrequently: false });

let ws = null, ready = false, running = false;
let inFlight = false, frameId = 0;
let lat = 0, fps = 0, frames = 0, fpsT = 0;
let lastGaze = null, calibrated = false, calibStats = null;
let sampling = null;
let results = [];
let pending = new Map();

function log(s){ $("log").textContent = s; }
function toast(s){
  const el = $("toast"); el.textContent = s; el.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>el.classList.remove("show"), 2200);
}
function setPill(id, text, cls){
  const el = $(id); el.textContent = text;
  el.className = "pill" + (cls ? " " + cls : "");
}
function wsUrl(){
  const host = location.hostname || "127.0.0.1";
  return `ws://${host}:${WS_PORT}/ws`;
}

function connect(){
  if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
  ws = new WebSocket(wsUrl());
  log("连接 " + wsUrl());
  ws.onopen = () => { setPill("pSrv","网关已连接","on"); log("已连接，等待模型就绪"); };
  ws.onclose = () => {
    ready = false; calibrated = false;
    setPill("pSrv","未连接","off"); setPill("pCal","未标定","");
    $("btnCalib").disabled = true; $("btnTest").disabled = true;
    log("连接断开");
  };
  ws.onerror = () => log("连接失败：确认 gaze-gateway 已在 " + WS_PORT + " 端口启动");
  ws.onmessage = ev => handle(JSON.parse(ev.data));
}

function send(obj){
  if (!ws || ws.readyState !== 1) return false;
  ws.send(JSON.stringify(obj)); return true;
}

function waitFor(type, timeout = 8000){
  return new Promise((resolve, reject) => {
    const t = setTimeout(() => { pending.delete(type); reject(new Error("等待超时: " + type)); }, timeout);
    pending.set(type, msg => { clearTimeout(t); pending.delete(type); resolve(msg); });
  });
}

function handle(msg){
  const waiter = pending.get(msg.type);
  if (waiter) waiter(msg);

  if (msg.type === "ready"){
    ready = true;
    $("btnCalib").disabled = !running;
    log(`模型就绪：${msg.model}　特征维度 ${msg.dim}　基准 ${msg.screen[0]}×${msg.screen[1]}`);
    setPill("pCal", calibrated ? "已标定" : "未标定", calibrated ? "on" : "");
  } else if (msg.type === "gaze"){
    inFlight = false;
    if (!msg.ok){
      dot.classList.add("lost");
      $("vFace").textContent = msg.face ? "有脸/估计失败" : "未检测到脸";
      return;
    }
    lastGaze = msg;
    frames++;
    if (msg.ms != null) lat = msg.ms;
    if (sampling) sampling.push([msg.nx, msg.ny]);
    drawDot(msg);
    $("vRaw").textContent = `${msg.nx.toFixed(3)}, ${msg.ny.toFixed(3)}`;
    $("vFace").textContent = msg.calibrated ? "跟踪中（已标定）" : "跟踪中（未标定）";
  } else if (msg.type === "point_begin_ack"){
    log("采集中…");
  } else if (msg.type === "point_ack"){
    $("vSamples").textContent = msg.total;
  } else if (msg.type === "calibrated"){
    if (msg.reset){ calibrated = false; setPill("pCal","未标定",""); $("vFit").textContent="—"; return; }
    if (msg.ok){
      calibrated = true; calibStats = msg;
      setPill("pCal","已标定","on");
      $("vFit").textContent = `μ${msg.err_mean_px}px / P90 ${msg.err_p90_px}px`;
      $("btnTest").disabled = false;
      toast(`标定完成：${msg.samples} 样本，训练误差 ${msg.err_mean_px}px`);
    } else {
      calibrated = false; setPill("pCal","标定失败","off");
      toast(msg.msg || "标定失败");
    }
  } else if (msg.type === "error"){
    toast(msg.msg || "服务错误"); log("错误：" + msg.msg);
  }
}

function drawDot({nx, ny, calibrated: cal}){
  dot.classList.remove("lost");
  const x = Math.max(0, Math.min(1, nx)), y = Math.max(0, Math.min(1, ny));
  dot.style.left = (cal ? (1 - x) : (1 - x)) * 100 + "%";
  dot.style.top = (y * 100) + "%";
  dot.style.opacity = cal ? "1" : ".45";
}

async function startCamera(){
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" }, audio: false
    });
    video.srcObject = stream;
    await video.play();
    setPill("pCam","摄像头已启动","on");
    running = true;
    $("btnStart").disabled = true; $("btnStop").disabled = false;
    connect();
    loop();
    toast("摄像头已启动");
  } catch (e){
    const map = {
      NotAllowedError: "摄像头权限被拒绝，请在系统设置中允许浏览器访问",
      NotFoundError: "未找到摄像头",
      NotReadableError: "摄像头被其他页面占用，请先关闭其他摄像头页面",
    };
    toast(map[e.name] || e.message);
    log("摄像头失败：" + e.name);
  }
}

function stopCamera(){
  running = false; inFlight = false;
  const s = video.srcObject;
  if (s) s.getTracks().forEach(t => t.stop());
  video.srcObject = null;
  setPill("pCam","摄像头已停止","");
  $("btnStart").disabled = false; $("btnStop").disabled = true;
  $("btnCalib").disabled = true; $("btnTest").disabled = true;
  dot.classList.add("lost");
  if (ws) { ws.close(); ws = null; }
}

function loop(){
  if (!running) return;
  if (ready && ws && ws.readyState === 1 && !inFlight && video.readyState >= 2){
    inFlight = true;
    gctx.drawImage(video, 0, 0, grab.width, grab.height);
    const b64 = grab.toDataURL("image/jpeg", 0.6).split(",")[1];
    send({ type: "frame", id: ++frameId, img: b64 });
    const now = performance.now();
    if (now - fpsT > 1000){ fps = frames * 1000 / (now - fpsT); frames = 0; fpsT = now;
      $("vFps").textContent = fps.toFixed(1) + " fps"; $("vLat").textContent = lat.toFixed(1) + " ms"; }
  }
  setTimeout(loop, 50);   // 上限 20 fps，避免本地队列堆积
}

const sleep = ms => new Promise(r => setTimeout(r, ms));
const overlay = $("overlay");

function place(el, x, y){ el.style.left = (x*100) + "%"; el.style.top = (y*100) + "%"; }

async function runCalibration(){
  if (!calibrated){
    send({ type: "calib_reset" });
    await sleep(80);
  }
  overlay.classList.add("show");
  overlay.querySelectorAll(".target,.ovlabel").forEach(n => { if (n.id !== "ovLabel") n.remove(); });
  $("vSamples").textContent = "0";
  send({ type: "calib_reset" });
  await sleep(120);

  try {
    for (let i = 0; i < CALIB.length; i++){
      const [x, y] = CALIB[i];
      $("ovLabel").textContent = `标定 ${i+1} / ${CALIB.length}　注视圆点，保持不动`;
      const d = document.createElement("div");
      d.className = "target";
      overlay.appendChild(d); place(d, x, y);
      await sleep(700);
      send({ type: "calib_point_begin" });
      await sleep(1100);
      send({ type: "calib_point", x, y });
      const ack = await waitFor("point_ack", 3000);
      d.classList.add("done");
      $("vSamples").textContent = ack.total;
      if (ack.n < 4) log(`注意：第 ${i+1} 点仅采到 ${ack.n} 帧`);
    }
    overlay.classList.remove("show");
    send({ type: "calib_fit" });
    const r = await waitFor("calibrated", 8000);
    if (!r.ok) toast(r.msg || "标定失败");
  } catch (e){
    overlay.classList.remove("show");
    toast(e.message);
  }
}

function metrics(){
  if (!results.length) return null;
  const errs = results.map(r => r.err).sort((a,b) => a-b);
  const mean = errs.reduce((a,b) => a+b, 0) / errs.length;
  const p90 = errs[Math.min(errs.length-1, Math.floor(errs.length*0.9))];
  const hit = errs.filter(e => e < 70).length / errs.length;
  return { mean, p90, hit };
}

function renderMetrics(){
  const m = metrics();
  if (!m) return;
  $("kMean").textContent = m.mean.toFixed(1) + "px";
  $("kP90").textContent = m.p90.toFixed(1) + "px";
  $("kHit").textContent = (m.hit*100).toFixed(0) + "%";
}

async function runPrecision(){
  if (!calibrated) return toast("请先完成 13 点标定");
  results = [];
  $("kMean").textContent = $("kP90").textContent = $("kHit").textContent = "—";
  $("btnExport").disabled = true;
  overlay.classList.add("show");
  overlay.querySelectorAll(".target").forEach(n => n.remove());
  try {
    for (let i = 0; i < TARGETS.length; i++){
      const [tx, ty] = TARGETS[i];
      $("ovLabel").textContent = `目标 ${i+1} / ${TARGETS.length}　盯住圆点，保持不动`;
      const d = document.createElement("div");
      d.className = "target";
      overlay.appendChild(d); place(d, tx, ty);
      await sleep(700);
      sampling = [];
      await sleep(650);
      const samples = sampling; sampling = null;
      d.classList.add("done");
      if (!samples.length){ results.push({ tx, ty, ok:false, err:Infinity, n:0 }); continue; }
      const px = samples.reduce((a,s) => a+s[0], 0) / samples.length;
      const py = samples.reduce((a,s) => a+s[1], 0) / samples.length;
      const err = Math.hypot((px - tx) * SCREEN.w, (py - ty) * SCREEN.h);
      results.push({ tx, ty, px, py, err, n: samples.length, ok: true });
      renderMetrics();
    }
    overlay.classList.remove("show");
    renderMetrics();
    $("btnExport").disabled = false;
    const m = metrics();
    toast(`完成：平均 ${m.mean.toFixed(1)}px，P90 ${m.p90.toFixed(1)}px，命中 ${(m.hit*100).toFixed(0)}%`);
  } catch (e){
    overlay.classList.remove("show"); sampling = null; toast(e.message);
  }
}

function exportJson(){
  const payload = {
    app: "mgaze-test",
    model: "GazeFollower/MGazeNet",
    createdAt: new Date().toISOString(),
    screenBasis: SCREEN,
    calibrated,
    calibration: calibStats,
    metrics: metrics(),
    results,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `mgaze-precision-${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

$("btnStart").onclick = startCamera;
$("btnStop").onclick = stopCamera;
$("btnCalib").onclick = runCalibration;
$("btnTest").onclick = runPrecision;
$("btnExport").onclick = exportJson;
$("vUrl").textContent = `127.0.0.1:${WS_PORT}`;
window.addEventListener("beforeunload", () => { if (ws) ws.close(); });
</script>
</body>
</html>
