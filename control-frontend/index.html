<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>隔空控制器 · 控制前端</title>
<script>
(function(){
  function apply(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("ac-theme",t);}catch(e){}}
  try{
    var t=localStorage.getItem("ac-theme");
    if(t!=="light"&&t!=="dark"){t=(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";}
    apply(t);
  }catch(e){document.documentElement.dataset.theme="dark";}
  document.addEventListener("DOMContentLoaded",function(){
    var b=document.getElementById("themeToggle");
    if(b){b.addEventListener("click",function(){apply(document.documentElement.dataset.theme==="light"?"dark":"light");});}
  });
})();
</script>
<script src="../controller-demo/vendor/webgazer/webgazer.js"></script>
<style>
  :root{
    --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --font-body:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    --ease:cubic-bezier(.16,1,.3,1); --cut:10px;
  }
  :root:not([data-theme]), :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0b0b07; --bg2:#16160f; --panel:rgba(22,22,15,.93);
    --line:rgba(245,197,24,.16); --line-strong:rgba(245,197,24,.5);
    --txt:#f7f2de; --dim:#a79d72; --faint:#6b6449;
    --acc:#f5c518; --acc-ink:#16160f; --acc2:#ffd94a;
    --acc-soft:rgba(245,197,24,.08); --bad:#ff5a4d; --good:#4cd964;
    --glow:rgba(245,197,24,.5); --grid-line:rgba(245,197,24,.06);
  }
  :root[data-theme="light"]{
    color-scheme:light;
    --bg:#f3f7fc; --bg2:#ffffff; --panel:rgba(255,255,255,.96);
    --line:rgba(37,99,235,.16); --line-strong:rgba(37,99,235,.5);
    --txt:#16233a; --dim:#5a6b84; --faint:#8fa0b4;
    --acc:#2563eb; --acc-ink:#ffffff; --acc2:#3b82f6;
    --acc-soft:rgba(37,99,235,.08); --bad:#e5484d; --good:#16a34a;
    --glow:rgba(37,99,235,.32); --grid-line:rgba(37,99,235,.07);
  }
  *{box-sizing:border-box; -webkit-user-select:none; user-select:none;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font:14px/1.5 var(--font-body);overflow:hidden;}

  #stage{position:fixed;inset:0;background:
    radial-gradient(1200px 700px at 50% 40%,var(--bg2) 0%,var(--bg) 65%);
    background-image:
      radial-gradient(1200px 700px at 50% 40%,var(--bg2) 0%,var(--bg) 65%),
      linear-gradient(var(--grid-line) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
    background-size:auto,44px 44px,44px 44px;}
  #stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
    background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.12) 3px 4px);opacity:.5;}

  .brand{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:3;
    font-family:var(--font-mono);font-weight:800;font-size:clamp(36px,7vw,96px);line-height:1;
    letter-spacing:.2em;text-indent:.2em;white-space:nowrap;pointer-events:none;
    background:linear-gradient(100deg,var(--faint) 0%,var(--faint) 32%,var(--acc) 45%,var(--acc2) 51%,var(--faint) 64%,var(--faint) 100%);
    background-size:230% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 16px var(--glow));animation:brand 3.2s linear infinite;}
  @keyframes brand{0%{background-position:115% 0}100%{background-position:-115% 0}}

  #cursor{position:fixed;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;
    border-radius:50%;pointer-events:none;z-index:50;opacity:0;transition:opacity .3s;
    background:radial-gradient(circle at 40% 35%,#fff,var(--acc2) 40%,var(--acc) 78%);
    box-shadow:0 0 0 3px var(--glow),0 0 24px var(--glow);}
  #cursor.live{opacity:1;}
  #cursor::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--bg);}

  .panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:4px;
    backdrop-filter:blur(8px);z-index:40;}
  .panel::before{content:"";position:absolute;top:-1px;left:-1px;width:14px;height:14px;
    border-top:2px solid var(--acc);border-left:2px solid var(--acc);pointer-events:none;}
  #pCtrl{right:16px;top:16px;padding:14px;width:300px;}
  #pStatus{left:16px;top:16px;padding:10px;width:280px;}
  #pLog{left:16px;bottom:16px;padding:10px 12px;width:360px;height:200px;display:flex;flex-direction:column;}

  h1{margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:1.5px;font-family:var(--font-mono);}
  .sub{font-size:11px;color:var(--dim);}
  .sub::before{content:"// ";color:var(--acc);font-family:var(--font-mono);}
  .phead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:0 0 8px;}
  .phead h1{margin:0;} .phead .sub{margin-top:2px;}
  .theme-toggle{flex:0 0 auto;width:30px;height:30px;border-radius:4px;clip-path:none;
    display:flex;align-items:center;justify-content:center;background:var(--bg2);color:var(--txt);border:1px solid var(--line);}
  .theme-toggle svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .theme-toggle .i-moon{display:none;}
  :root[data-theme="light"] .theme-toggle .i-sun{display:none;}
  :root[data-theme="light"] .theme-toggle .i-moon{display:block;}

  button{font:inherit;cursor:pointer;border:0;background:var(--bg2);color:var(--txt);
    padding:9px 12px;transition:.18s;
    clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));}
  button:hover:not(:disabled){background:var(--panel);color:var(--acc);}
  button:disabled{opacity:.4;cursor:not-allowed;}
  button.primary{background:var(--acc);color:var(--acc-ink);font-weight:600;}
  button.primary:hover:not(:disabled){background:var(--acc2);color:var(--acc-ink);}
  .row{display:flex;gap:8px;align-items:center;} .row>*{flex:1;}
  .row.tight>*{flex:0 0 auto;}
  .lbl{font-size:10px;color:var(--dim);margin:10px 0 5px;letter-spacing:1.5px;font-family:var(--font-mono);text-transform:uppercase;}
  .chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);}
  .chk input{accent-color:var(--acc);}
  input[type=text]{font-size:12px;padding:6px 8px;border:1px solid var(--line);border-radius:4px;
    background:var(--bg2);color:var(--txt);width:100%;font-family:var(--font-mono);}

  .gnow{display:flex;align-items:center;gap:8px;font-size:13px;}
  .gnow .ic{font-size:22px;} .gnow .nm{font-weight:600;}
  .gnow .ac{margin-left:auto;color:var(--acc);font-size:12px;font-family:var(--font-mono);}
  .meta{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .pill{font-size:10px;padding:2px 8px;border-radius:2px;border:1px solid var(--line);color:var(--dim);font-family:var(--font-mono);letter-spacing:.5px;}
  .pill.on{color:var(--acc);border-color:var(--line-strong);background:var(--acc-soft);}
  .pill.bad{color:var(--bad);border-color:rgba(255,90,77,.4);}
  .pill.good{color:var(--good);border-color:var(--good);}

  #log{flex:1;overflow:auto;font:11px/1.55 var(--font-mono);color:var(--dim);white-space:pre-wrap;word-break:break-word;}
  #log b{color:var(--txt);} #log .ok{color:var(--good);} #log .er{color:var(--bad);} #log .ac{color:var(--acc);}

  .coord{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:30;
    font-family:var(--font-mono);font-size:12px;color:var(--dim);background:var(--panel);
    border:1px solid var(--line);padding:6px 14px;border-radius:2px;letter-spacing:.5px;}

  #webgazerVideoContainer{position:fixed !important;left:0 !important;top:0 !important;
    width:320px !important;height:240px !important;opacity:0 !important;
    pointer-events:none !important;z-index:0 !important;overflow:hidden !important;}
  #webgazerFaceOverlay,#webgazerFaceFeedbackBox{display:none !important;}
</style>
</head>
<body>

<div id="stage">
  <div id="cursor"></div>
  <div class="brand">EPBL</div>
</div>

<div class="coord" id="coord">(0.50, 0.50)</div>

<!-- 左上：连接 + 手势状态 -->
<div class="panel" id="pStatus">
  <div class="gnow">
    <span class="ic" id="gIcon">·</span>
    <span class="nm" id="gName">未检测</span>
    <span class="ac" id="gAct">—</span>
  </div>
  <div class="meta">
    <span class="pill" id="pillBack">后端</span>
    <span class="pill" id="pillCam">摄像头</span>
    <span class="pill" id="pillHand">手势</span>
  </div>
</div>

<!-- 右上：控制 -->
<div class="panel" id="pCtrl">
  <div class="phead">
    <div>
      <h1>隔空控制器 · 控制前端</h1>
      <div class="sub">眼动指哪 · 手势做什么 · 后端执行</div>
    </div>
    <button id="themeToggle" class="theme-toggle" title="切换深浅色" aria-label="切换深浅色">
      <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>

  <div class="lbl">后端连接</div>
  <input type="text" id="wsUrl" value="ws://127.0.0.1:8899/ws" spellcheck="false">
  <div class="row tight" style="margin-top:6px">
    <input type="text" id="wsToken" value="air-controller-dev" style="flex:1" spellcheck="false">
    <button id="btnConnect" style="flex:0 0 auto">连接</button>
  </div>

  <div class="lbl">输入源</div>
  <div class="row">
    <button class="primary" id="btnBoot">启动摄像头 + 模型</button>
  </div>

  <div class="lbl">模拟模式（无摄像头联调）</div>
  <div class="row tight">
    <label class="chk"><input type="checkbox" id="simGaze" checked> 鼠标→光标</label>
    <label class="chk"><input type="checkbox" id="simGesture" checked> 数字键→手势</label>
  </div>
  <div class="sub" style="margin-top:6px">键 1 握拳 · 2 拇指 · 3 食指 · 4 二指 · 5 上滚 · 6 下滚</div>
</div>

<!-- 左下：日志 -->
<div class="panel" id="pLog">
  <div class="row tight" style="margin-bottom:6px">
    <span style="font-size:12px;font-weight:600;flex:1">事件日志</span>
    <button id="btnClearLog" style="padding:3px 8px;font-size:11px;flex:0 0 auto">清空</button>
  </div>
  <div id="log"></div>
</div>

<script type="module">
import { classifyHand, createGestureStream } from "./js/gesture.js";
import { createBackend } from "./js/backend.js";

const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- 手势显示 ---------- */
const G = {
  fist:          { name: "握拳",      act: "点击", icon: "✊" },
  thumb:         { name: "拇指朝上",  act: "返回", icon: "👍" },
  point:         { name: "食指",      act: "主页", icon: "☝️" },
  two:           { name: "二指",      act: "菜单", icon: "✌️" },
  four_up:       { name: "四指朝上",  act: "上滚", icon: "🖐" },
  four_down:     { name: "四指朝下",  act: "下滚", icon: "🖐" },
  open:          { name: "张开·水平", act: "中立", icon: "🖐" },
  none:          { name: "未检测",    act: "—",    icon: "·" },
};

/* ---------- 参数 ---------- */
const GT = { enterFrames: 3, fingerRatio: 1.2, thumbRatio: 1.25, scrollDeadband: 0.12 };
const EMA = 0.16;

/* ---------- 状态 ---------- */
const S = { running: false, raw: "none", gx: 0.5, gy: 0.5, gazeCount: 0 };

/* ---------- 后端 ---------- */
const backend = createBackend($("wsUrl").value, $("wsToken").value);
backend.onMessage(onBackendMsg);

function onBackendMsg(msg) {
  if (!msg || typeof msg !== "object") return;
  if (msg.type === "state") {
    setPill($("pillBack"), msg.connected ? true : false, msg.connected ? "后端 · 已连接" : "后端 · 断开");
    if (msg.connected) log("已连接后端" + (msg.page ? `（${msg.page}）` : ""), "ok");
    else log("后端连接断开，自动重连中…", "er");
  } else if (msg.type === "camera") {
    applyCamera(msg.state);
  } else if (msg.type === "error") {
    log("后端错误：" + (msg.message || ""), "er");
  }
}

// 应用后端下发的摄像头开关指令
function applyCamera(state) {
  if (state === "on") {
    if (!S.running) { log("后端指令：开启摄像头"); boot(); }
  } else {
    stopCamera();
  }
}

function setPill(el, on, text) {
  el.classList.toggle("on", on === true);
  el.classList.toggle("bad", on === false);
  el.classList.toggle("good", on === true);
  if (text) el.textContent = text;
}

$("btnConnect").addEventListener("click", () => {
  location.reload(); // 简化：重连采用刷新，避免 WebSocket 实例重复
});

/* ---------- 日志 ---------- */
const logs = [];
function log(msg, cls) {
  const t = new Date().toLocaleTimeString("zh-CN", { hour12: false });
  logs.unshift({ t, msg, cls: cls || "" });
  if (logs.length > 80) logs.pop();
  $("log").innerHTML = logs.map(l => `<div><span style="color:#5b6d87">${l.t}</span> <span class="${l.cls}">${l.msg}</span></div>`).join("");
}
$("btnClearLog").addEventListener("click", () => { logs.length = 0; $("log").innerHTML = ""; });

function renderHand() {
  const m = G[S.raw] || G.none;
  $("gIcon").textContent = m.icon;
  $("gName").textContent = m.name;
  $("gAct").textContent = m.act;
}

/* ---------- 光标 ---------- */
const cursorEl = $("cursor");
function setCursor(px, py) {
  cursorEl.style.left = px + "px";
  cursorEl.style.top = py + "px";
  $("coord").textContent = `(${(px / innerWidth).toFixed(3)}, ${(py / innerHeight).toFixed(3)})`;
}

/* ---------- 手势流 → 后端 ---------- */
const gestureStream = createGestureStream({
  enterFrames: GT.enterFrames,
  onEvent: (ev) => {
    backend.sendGesture(ev.name, ev.state);
    const m = G[ev.name] || { name: ev.name };
    log(`手势 ${m.icon || ""} ${m.name} → ${ev.state}`, ev.state === "start" ? "ac" : "");
  },
});

/* ---------- WebGazer 眼动 ---------- */
let gInit = false;
function onGaze(data) {
  if (!data) { setPill($("pillCam"), true, "摄像头 · 无视线"); return; }
  S.gazeCount++;
  const nx = clamp(data.x / innerWidth, 0, 1);
  const ny = clamp(data.y / innerHeight, 0, 1);
  if (!gInit) { S.gx = nx; S.gy = ny; gInit = true; }
  S.gx += (nx - S.gx) * EMA;
  S.gy += (ny - S.gy) * EMA;
  backend.sendCursor(S.gx, S.gy);
  setCursor(S.gx * innerWidth, S.gy * innerHeight);
}

async function waitVideoReady(vf, timeoutMs = 3000) {
  const t0 = performance.now();
  while (vf && !(vf.videoWidth && vf.readyState >= 2)) {
    if (performance.now() - t0 > timeoutMs) break;
    await new Promise(r => setTimeout(r, 50));
  }
}

function isBlackFrame(el) {
  try {
    let canvas = el;
    if (el.tagName === "VIDEO") {
      canvas = document.createElement("canvas");
      canvas.width = 64; canvas.height = 48;
      canvas.getContext("2d").drawImage(el, 0, 0, 64, 48);
    }
    const ctx = canvas.getContext("2d");
    const d = ctx.getImageData(0, 0, Math.min(48, canvas.width), Math.min(48, canvas.height)).data;
    let sum = 0;
    for (let i = 0; i < d.length; i += 4) sum += d[i] + d[i + 1] + d[i + 2];
    return d.length > 0 && sum / (d.length / 4) < 6;
  } catch (e) { return false; }
}

async function bootEye() {
  if (typeof webgazer === "undefined") {
    log("WebGazer 未加载", "er"); return false;
  }
  webgazer.setRegression("ridge");
  webgazer.showPredictionPoints(false);
  webgazer.showVideoPreview(true);
  webgazer.showFaceOverlay(false);
  webgazer.showFaceFeedbackBox(false);
  webgazer.setGazeListener(onGaze);
  webgazer.params.camConstraints = {
    video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" }, audio: false,
  };
  try { await webgazer.begin(); }
  catch (e) { log("WebGazer 启动失败：" + (e && e.message || e), "er"); setPill($("pillCam"), false, "摄像头 · 失败"); return false; }
  cursorEl.classList.add("live");

  const vf = document.getElementById("webgazerVideoFeed");
  handImg = vf;
  await waitVideoReady(vf);
  if (!vf || !vf.videoWidth) { log("WebGazer 未拿到视频画面", "er"); setPill($("pillCam"), false, "摄像头 · 无画面"); return false; }
  let black = true;
  for (let i = 0; i < 3; i++) {
    if (!isBlackFrame(vf)) { black = false; break; }
    await new Promise(r => setTimeout(r, 200));
  }
  if (black) { log("摄像头返回黑帧：被占用或权限异常", "er"); setPill($("pillCam"), false, "摄像头 · 黑帧"); return false; }
  log(`摄像头就绪 ${vf.videoWidth}×${vf.videoHeight}`, "ok");
  setPill($("pillCam"), true, `摄像头 · ${vf.videoWidth}×${vf.videoHeight}`);
  return true;
}

/* ---------- 手势识别 ---------- */
let recognizer = null, handImg = null, lastDetect = 0;
async function bootHand() {
  try {
    const vision = await import("../draw/vendor/vision/vision_bundle.mjs");
    const fileset = await vision.FilesetResolver.forVisionTasks("../draw/vendor/vision/wasm");
    const opts = (delegate) => ({
      baseOptions: { modelAssetPath: "../draw/models/gesture_recognizer.task", delegate },
      runningMode: "VIDEO", numHands: 1,
      minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5,
    });
    try { recognizer = await vision.GestureRecognizer.createFromOptions(fileset, opts("GPU")); }
    catch (e) { log("GPU 初始化失败，回退 CPU：" + (e && e.message || e)); recognizer = await vision.GestureRecognizer.createFromOptions(fileset, opts("CPU")); }
    setPill($("pillHand"), true, "手势 · 就绪");
    requestAnimationFrame(handLoop);
    return true;
  } catch (e) {
    log("手势模型加载失败：" + (e && e.message || e), "er");
    setPill($("pillHand"), false, "手势 · 失败");
    return false;
  }
}

function srcW() { return handImg ? (handImg.videoWidth || handImg.width || 0) : 0; }
function srcH() { return handImg ? (handImg.videoHeight || handImg.height || 0) : 0; }

function handLoop(now) {
  requestAnimationFrame(handLoop);
  if (!recognizer || !handImg || !srcW()) return;
  if (now - lastDetect < 34) return;
  lastDetect = now;
  let res;
  try { res = recognizer.recognizeForVideo(handImg, now); }
  catch (e) { log("识别出错：" + (e && e.message || e), "er"); return; }
  const lm = res && res.landmarks && res.landmarks[0];
  if (lm) {
    const c = classifyHand(lm, GT);
    S.raw = c.gesture;
    gestureStream.push(c.gesture, performance.now());
  } else {
    S.raw = "none";
    gestureStream.push("none", performance.now());
  }
  renderHand();
}

/* ---------- 启动 ---------- */
async function boot() {
  $("btnBoot").disabled = true;
  log("正在启动眼动（WebGazer 开摄像头）…");
  const okEye = await bootEye();
  if (!okEye) { $("btnBoot").disabled = false; return; }
  log("正在加载手势模型…");
  const okHand = await bootHand();
  S.running = true;
  log(okHand ? "全部就绪 ✓" : "手势不可用，仅眼动", okHand ? "ok" : "er");
}
$("btnBoot").addEventListener("click", boot);

/* ---------- 停止摄像头 ---------- */
function stopCamera() {
  if (!S.running && !gInit) { log("摄像头本就未开启"); return; }
  try {
    if (typeof webgazer !== "undefined") {
      try { webgazer.clearGazeListener(); } catch (e) {}
      try { webgazer.end(); } catch (e) {}
    }
  } catch (e) {}
  // 兜底：直接停掉视频轨（webgazer.end 可能不彻底）
  try {
    const vf = document.getElementById("webgazerVideoFeed");
    if (vf && vf.srcObject) {
      vf.srcObject.getTracks().forEach(t => { try { t.stop(); } catch (e) {} });
    }
  } catch (e) {}
  recognizer = null;
  handImg = null;
  S.running = false;
  S.raw = "none";
  gInit = false;
  cursorEl.classList.remove("live");
  renderHand();
  $("btnBoot").disabled = false;
  setPill($("pillCam"), false, "摄像头 · 已关闭");
  setPill($("pillHand"), false, "手势 · 已关闭");
  log("摄像头已关闭");
}

/* ---------- 模拟模式 ---------- */
$("stage").addEventListener("mousemove", (e) => {
  if (!$("simGaze").checked || S.running) return;
  const nx = e.clientX / innerWidth, ny = e.clientY / innerHeight;
  backend.sendCursor(nx, ny);
  setCursor(e.clientX, e.clientY);
});
const SIM_KEYS = { "1": "fist", "2": "thumb", "3": "point", "4": "two", "5": "four_up", "6": "four_down" };
const held = {};
document.addEventListener("keydown", (e) => {
  if (!$("simGesture").checked || S.running) return;
  const g = SIM_KEYS[e.key];
  if (g && !held[g]) { held[g] = true; backend.sendGesture(g, "start"); log(`[模拟] ${g} start`, "ac"); }
});
document.addEventListener("keyup", (e) => {
  const g = SIM_KEYS[e.key];
  if (g && held[g]) { held[g] = false; backend.sendGesture(g, "end"); }
});

/* ---------- 初始化 ---------- */
backend.connect();
renderHand();
log("前端就绪。可先「连接」后端，再「启动摄像头」或直接用模拟模式联调。");
</script>
</body>
</html>
