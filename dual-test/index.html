<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>眼动光标 + 手势控制 · 测试台</title>
<!-- 主题：首屏前设置 data-theme，避免闪烁 -->
<script>
(function(){
  function apply(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("dual-test-theme",t);}catch(e){}}
  try{
    var t=localStorage.getItem("dual-test-theme");
    if(t!=="light"&&t!=="dark"){t=(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";}
    apply(t);
  }catch(e){document.documentElement.dataset.theme="dark";}
  document.addEventListener("DOMContentLoaded",function(){
    var b=document.getElementById("themeToggle");
    if(b){b.addEventListener("click",function(){
      apply(document.documentElement.dataset.theme==="light"?"dark":"light");
    });}
  });
})();
</script>
<!-- WebGazer 必须用普通 script（全局变量），不能用 module -->
<script src="../controller-demo/vendor/webgazer/webgazer.js"></script>
<style>
  :root{
    --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --font-body:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    --ease:cubic-bezier(.16,1,.3,1);
    --cut:10px;
  }
  /* 深色 · 黑黄（参考 alexiax dark） */
  :root:not([data-theme]), :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0b0b07; --bg2:#16160f; --panel:rgba(22,22,15,.93);
    --line:rgba(245,197,24,.16); --line-strong:rgba(245,197,24,.5);
    --txt:#f7f2de; --dim:#a79d72; --faint:#6b6449;
    --acc:#f5c518; --acc-ink:#16160f; --acc2:#ffd94a;
    --acc-soft:rgba(245,197,24,.08);
    --warn:#f5c518; --bad:#ff5a4d;
    --glow:rgba(245,197,24,.5);
    --grid-line:rgba(245,197,24,.06);
    --scan:rgba(0,0,0,.14);
  }
  /* 浅色 · 蓝白 */
  :root[data-theme="light"]{
    color-scheme:light;
    --bg:#f3f7fc; --bg2:#ffffff; --panel:rgba(255,255,255,.96);
    --line:rgba(37,99,235,.16); --line-strong:rgba(37,99,235,.5);
    --txt:#16233a; --dim:#5a6b84; --faint:#8fa0b4;
    --acc:#2563eb; --acc-ink:#ffffff; --acc2:#3b82f6;
    --acc-soft:rgba(37,99,235,.08);
    --warn:#2563eb; --bad:#e5484d;
    --glow:rgba(37,99,235,.32);
    --grid-line:rgba(37,99,235,.07);
    --scan:rgba(37,99,235,.03);
  }
  *{box-sizing:border-box; -webkit-user-select:none; user-select:none;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font:14px/1.5 var(--font-body);overflow:hidden;}

  /* ---------- 全屏测试舞台 ---------- */
  #stage{position:fixed;inset:0;background:
    radial-gradient(1200px 700px at 50% 40%,var(--bg2) 0%,var(--bg) 65%);
    background-image:
      radial-gradient(1200px 700px at 50% 40%,var(--bg2) 0%,var(--bg) 65%),
      linear-gradient(var(--grid-line) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
    background-size:auto,44px 44px,44px 44px;}
  /* CRT 扫描线 */
  #stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
    background:repeating-linear-gradient(0deg,transparent 0 3px,var(--scan) 3px 4px);opacity:.55;}

  /* 光标轨迹方格 */
  #trail{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;}

  /* ---------- 品牌大字 EPBL（刷新扫光） ---------- */
  .brand{
    position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:3;
    font-family:var(--font-mono);font-weight:800;font-size:clamp(44px,9vw,128px);line-height:1;
    letter-spacing:.18em;text-indent:.18em;white-space:nowrap;pointer-events:none;user-select:none;
    background:linear-gradient(100deg,
      var(--faint) 0%,var(--faint) 32%,var(--acc) 45%,var(--acc2) 51%,var(--faint) 64%,var(--faint) 100%);
    background-size:230% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 16px var(--glow));
    animation:brandRefresh 3.2s linear infinite;
  }
  @keyframes brandRefresh{
    0%{background-position:115% 0;}
    100%{background-position:-115% 0;}
  }

  /* ---------- 眼动光标 ---------- */
  #cursor{position:fixed;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;
    border-radius:50%;pointer-events:none;z-index:50;opacity:0;transition:opacity .3s;
    background:radial-gradient(circle at 40% 35%,#ffffff,var(--acc2) 40%,var(--acc) 78%);
    box-shadow:0 0 0 3px var(--glow),0 0 24px var(--glow);}
  #cursor.live{opacity:1;}
  #cursor::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--bg);}

  /* ---------- 目标点 ---------- */
  #target{position:fixed;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;
    border:3px dashed var(--acc2);background:transparent;
    display:none;z-index:20;pointer-events:none;animation:tp 1.1s ease-in-out infinite;}
  #target::after{content:"";position:absolute;inset:38px;border-radius:50%;background:var(--acc2);}
  @keyframes tp{0%,100%{transform:scale(1)}50%{transform:scale(.92)}}

  /* ---------- 四按钮 ---------- */
  .gbtn{position:fixed;width:190px;height:112px;border-radius:6px;
    border:1px solid var(--line);background:var(--panel);color:var(--txt);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    z-index:15;transition:border-color .18s,box-shadow .18s,transform .12s;}
  .gbtn .ic{font-size:26px;line-height:1;}
  .gbtn .nm{font-size:15px;font-weight:600;letter-spacing:.5px;}
  .gbtn .ac{font-size:11px;color:var(--dim);font-family:var(--font-mono);}
  .gbtn.target{border-color:var(--acc2);box-shadow:0 0 0 2px var(--glow),0 0 32px var(--glow);}
  .gbtn.ok{border-color:var(--acc);box-shadow:0 0 0 3px var(--glow);transform:scale(1.03);}
  .gbtn.bad{border-color:var(--bad);box-shadow:0 0 0 3px rgba(255,90,77,.45);}

  /* ---------- 面板 ---------- */
  .panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:4px;
    backdrop-filter:blur(8px);z-index:40;}
  .panel::before{content:"";position:absolute;top:-1px;left:-1px;width:14px;height:14px;
    border-top:2px solid var(--acc);border-left:2px solid var(--acc);pointer-events:none;}
  #pCam{left:16px;top:16px;padding:10px;width:252px;}
  #pCtrl{right:16px;top:16px;padding:14px;width:296px;}
  #pLog{left:16px;bottom:16px;padding:10px 12px;width:340px;height:212px;display:flex;flex-direction:column;}
  #pRes{right:16px;bottom:16px;padding:12px 14px;width:296px;}

  h1{margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:1.5px;font-family:var(--font-mono);}
  .sub{font-size:11px;color:var(--dim);}
  .sub::before{content:"// ";color:var(--acc);font-family:var(--font-mono);}

  .gnow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;}
  .gnow .ic{font-size:22px;}
  .gnow .nm{font-weight:600;}
  .gnow .ac{margin-left:auto;color:var(--acc);font-size:12px;font-family:var(--font-mono);}
  .meta{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .pill{font-size:10px;padding:2px 8px;border-radius:2px;border:1px solid var(--line);color:var(--dim);
    font-family:var(--font-mono);letter-spacing:.5px;}
  .pill.on{color:var(--acc);border-color:var(--line-strong);background:var(--acc-soft);}
  .pill.bad{color:var(--bad);border-color:rgba(255,90,77,.4);}

  button{font:inherit;cursor:pointer;position:relative;border:0;
    background:var(--bg2);color:var(--txt);padding:9px 12px;transition:.18s;
    clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));}
  button:hover:not(:disabled){background:var(--panel);color:var(--acc);}
  button:disabled{opacity:.4;cursor:not-allowed;}
  button.primary{background:var(--acc);color:var(--acc-ink);font-weight:600;}
  button.primary:hover:not(:disabled){background:var(--acc2);color:var(--acc-ink);}
  button.ghost{background:transparent;color:var(--dim);}
  button.ghost:hover:not(:disabled){color:var(--acc);}
  .row{display:flex;gap:8px;align-items:center;}
  .row > *{flex:1;}
  .row.tight > *{flex:0 0 auto;}
  .lbl{font-size:10px;color:var(--dim);margin:10px 0 5px;letter-spacing:1.5px;font-family:var(--font-mono);text-transform:uppercase;}
  .chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);}
  .chk input{accent-color:var(--acc);}

  #log{flex:1;overflow:auto;font:11px/1.55 var(--font-mono);
    color:var(--dim);white-space:pre-wrap;word-break:break-word;}
  #log b{color:var(--txt);}
  #log .ok{color:var(--acc);}
  #log .er{color:var(--bad);}

  #res{font-size:12px;}
  #res table{width:100%;border-collapse:collapse;}
  #res td{padding:4px 0;border-bottom:1px solid var(--line);}
  #res td:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--txt);font-family:var(--font-mono);}
  #res tr:last-child td{border-bottom:0;}
  #res .note{color:var(--dim);font-size:11px;margin-top:8px;line-height:1.5;}

  /* ---------- 标定遮罩 ---------- */
  #calib{position:fixed;inset:0;z-index:100;display:none;background:var(--bg);}
  #calib.show{display:block;}
  #calib .tips{position:absolute;left:50%;top:18px;transform:translateX(-50%);
    text-align:center;font-size:15px;line-height:1.8;color:var(--dim);}
  #calib .tips b{color:var(--acc);}
  .cdot{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;
    border:2px solid var(--acc2);background:transparent;color:var(--acc2);
    font-weight:700;font-family:var(--font-mono);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .cdot:hover{background:var(--acc-soft);}
  .cdot.done{opacity:.25;pointer-events:none;}
  #calibBar{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);
    font-size:13px;color:var(--dim);font-family:var(--font-mono);}
  #calibClose{position:absolute;right:24px;top:20px;}

  .hint{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:30;
    font-size:12px;color:var(--dim);background:var(--panel);border:1px solid var(--line);
    padding:6px 14px;border-radius:2px;font-family:var(--font-mono);letter-spacing:.5px;}

  /* 留在视口内、完全透明：display:none 或移出视口都可能让浏览器暂停视频解码 */
  #webgazerVideoContainer{position:fixed !important;left:0 !important;top:0 !important;
    width:320px !important;height:240px !important;opacity:0 !important;
    pointer-events:none !important;z-index:0 !important;overflow:hidden !important;}
  #webgazerFaceOverlay,#webgazerFaceFeedbackBox{display:none !important;}

  /* ---------- 面板头部 + 主题切换 ---------- */
  .phead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:0 0 8px;}
  .phead h1{margin:0;}
  .phead .sub{margin-top:2px;}
  .theme-toggle{flex:0 0 auto;width:34px;height:34px;border-radius:4px;clip-path:none;
    display:flex;align-items:center;justify-content:center;
    background:var(--bg2);color:var(--txt);border:1px solid var(--line);}
  .theme-toggle:hover{color:var(--acc);border-color:var(--line-strong);}
  .theme-toggle svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;}
  .theme-toggle .i-moon{display:none;}
  :root[data-theme="light"] .theme-toggle .i-sun{display:none;}
  :root[data-theme="light"] .theme-toggle .i-moon{display:block;}
</style>
</head>
<body>

<div id="stage">
  <canvas id="trail"></canvas>
  <div id="cursor"></div>
  <div id="target"></div>
  <div class="brand" id="brand" data-text="EPBL">EPBL</div>
</div>

<div class="hint" id="hint">眼动控光标 · 手势发命令 —— 先启动并标定</div>

<!-- 左上：摄像头 + 当前手势 -->
<div class="panel" id="pCam">
  <div class="gnow">
    <span class="ic" id="gIcon">·</span>
    <span class="nm" id="gName">未检测</span>
    <span class="ac" id="gAct">—</span>
  </div>
  <div class="meta">
    <span class="pill" id="pillCam">摄像头</span>
    <span class="pill" id="pillEye">视线</span>
    <span class="pill" id="pillHand">手势</span>
    <span class="pill" id="pillFps">-- fps</span>
  </div>
</div>

<!-- 右上：控制 -->
<div class="panel" id="pCtrl">
  <div class="phead">
    <div>
      <h1>眼动光标 + 手势控制</h1>
      <div class="sub">眼动负责“指哪”，手势负责“做什么”</div>
    </div>
    <button id="themeToggle" class="theme-toggle" title="切换深浅色" aria-label="切换深浅色">
      <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>

  <div class="lbl">第一步 · 启动</div>
  <div class="row">
    <button class="primary" id="btnBoot">启动摄像头 + 模型</button>
  </div>

  <div class="lbl">第二步 · 标定（13 点）</div>
  <div class="row">
    <button id="btnCalib" disabled>开始标定</button>
  </div>

  <div class="lbl">第三步 · 量化测试</div>
  <div class="row">
    <button id="btnGaze" disabled>眼动精度测试</button>
  </div>
  <div class="row" style="margin-top:6px">
    <button id="btnJoint" disabled>眼-手联合点击</button>
  </div>

  <div class="lbl">光标参数</div>
  <div class="row tight">
    <label class="chk"><input type="checkbox" id="optMagnet" checked> 按钮磁吸</label>
    <label class="chk" style="margin-left:auto">平滑
      <input id="optEma" type="range" min="5" max="45" value="16" style="width:80px">
    </label>
  </div>

  <div class="lbl">操作提示</div>
  <div class="sub" id="stepHint">启动后先做 13 点标定；标定越认真，光标越准。</div>

  <div class="row" style="margin-top:10px">
    <button class="ghost" id="btnExport">导出结果 JSON</button>
  </div>
</div>

<!-- 左下：事件日志 -->
<div class="panel" id="pLog">
  <div class="row tight" style="margin-bottom:6px">
    <span style="font-size:12px;font-weight:600;flex:1">事件日志</span>
    <button class="ghost" id="btnClearLog" style="padding:3px 8px;font-size:11px;flex:0 0 auto">清空</button>
  </div>
  <div id="log"></div>
</div>

<!-- 右下：结果 -->
<div class="panel" id="pRes">
  <div style="font-size:12px;font-weight:600;margin-bottom:6px">测试结果</div>
  <div id="res"><div class="note">尚未运行测试。</div></div>
</div>

<!-- 标定遮罩 -->
<div id="calib">
  <button class="ghost" id="calibClose">关闭</button>
  <div class="tips" id="calibTips">
    <b>13 点标定</b><br>
    依次点击 13 个圆点，<b>点击后眼睛继续盯住圆点约 0.7 秒</b>，等它打勾再移开<br>
    不要只动鼠标、眼睛看别处
  </div>
  <div id="calibBar">已标定 0 / 13</div>
</div>

<script type="module">
/* =====================================================================
   眼动光标 + 手势控制 测试台
   - 眼动：WebGazer（复用 controller-demo/vendor）
   - 手势：MediaPipe GestureRecognizer（复用 draw/ 的模型与 wasm）
   - 测什么：
     1) 眼动精度：随机目标点，统计注视点与目标的像素偏差 / 命中率
     2) 眼-手联合：看准按钮 + 握拳确认，统计成功率 / 误点 / 耗时
   ===================================================================== */

const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const Q = new URLSearchParams(location.search);
const gnum = (k, d) => { const v = parseFloat(Q.get(k)); return Number.isFinite(v) ? v : d; };

/* ---------- 手势参数（与 controller-demo 一致） ---------- */
const GT = {
  enterFrames:    gnum("gEnter", 3),
  cooldown:       gnum("gCooldown", 900),
  scrollThrottle: gnum("gScroll", 120),
  scrollStep:     gnum("gStep", 40),
  fingerRatio:    gnum("gFinger", 1.2),
  thumbRatio:     gnum("gThumb", 1.25),
  scrollDeadband: gnum("gDead", 0.12),
};

const G = {
  fist:          { name: "握拳",       act: "确认 / 点击", icon: "✊" },
  thumb:         { name: "拇指朝上",   act: "返回",        icon: "👍" },
  point:         { name: "食指",       act: "主页",        icon: "☝️" },
  two:           { name: "二指",       act: "菜单",        icon: "✌️" },
  "scroll-up":   { name: "张开·指尖上", act: "上滚",       icon: "🖐" },
  "scroll-down": { name: "张开·指尖下", act: "下滚",       icon: "🖐" },
  open:          { name: "张开·水平",   act: "中立",        icon: "🖐" },
  none:          { name: "未检测",      act: "—",          icon: "·" },
};

/* ---------- 状态 ---------- */
const S = {
  phase: "idle",            // idle | calib | gaze-settle | gaze-sample | gaze-gap | joint | joint-gap | done
  cursor: { x: innerWidth / 2, y: innerHeight / 2 },
  ema: 0.16, magnet: true, magnetR: 90,
  calibDone: false,
  running: false,
  lm: null, raw: "none", feat: null,
  gazeCount: 0, lastHand: 0,
  samples: [],
  target: null,
  logs: [],
  gaze: { idx: 0, total: 12, errs: [], hit: 0, empty: 0 },
  joint: { round: 0, total: 10, ok: 0, bad: 0, timeout: 0, miss: 0, times: [], t0: 0, target: null },
};

const FINGERS = [{ tip: 8, mcp: 5 }, { tip: 12, mcp: 9 }, { tip: 16, mcp: 13 }, { tip: 20, mcp: 17 }];
const CONN = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
              [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

const d2 = (lm, a, b) => {
  const dx = lm[a].x - lm[b].x, dy = lm[a].y - lm[b].y;
  return Math.hypot(dx, dy);
};

/* ---------- 分类器：与 controller-demo 逐行一致 ---------- */
function fingerUp(lm, tip, mcp) {
  return d2(lm, tip, 0) > d2(lm, mcp, 0) * GT.fingerRatio;
}
function thumbUp(lm) {
  return d2(lm, 4, 9) > d2(lm, 2, 9) * GT.thumbRatio;
}
function classifyHand(lm) {
  const ext = FINGERS.map(f => fingerUp(lm, f.tip, f.mcp));
  const n = ext.filter(Boolean).length;
  const th = thumbUp(lm);
  const tipsY = FINGERS.reduce((a, f) => a + lm[f.tip].y, 0) / 4;
  const palmY = lm[9].y;
  const dy = tipsY - palmY;

  if (n === 4) {
    if (dy < -GT.scrollDeadband) return { gesture: "scroll-up", feat: { ext, th, dy } };
    if (dy > GT.scrollDeadband) return { gesture: "scroll-down", feat: { ext, th, dy } };
    return { gesture: "open", feat: { ext, th, dy } };
  }
  if (n === 0) return { gesture: th ? "thumb" : "fist", feat: { ext, th, dy } };
  if (n === 1 && ext[0]) return { gesture: "point", feat: { ext, th, dy } };
  if (n === 2 && ext[0] && ext[1]) return { gesture: "two", feat: { ext, th, dy } };
  return { gesture: "none", feat: { ext, th, dy } };
}

/* ---------- 状态机 ---------- */
const GS = { cand: null, streak: 0, lastFire: 0, lastScroll: 0 };
function gsReset() { GS.cand = null; GS.streak = 0; }
function gsStep(raw, now) {
  const g = raw || "none";
  if (g === "none") { gsReset(); return null; }
  if (g === GS.cand) GS.streak++; else { GS.cand = g; GS.streak = 1; }
  if (GS.streak < GT.enterFrames) return null;

  const discrete = g === "fist" || g === "thumb" || g === "point" || g === "two";
  const scroll = g === "scroll-up" || g === "scroll-down";

  if (discrete) {
    if (now - GS.lastFire < GT.cooldown) return null;
    GS.lastFire = now;
    return { type: "discrete", gesture: g };
  }
  if (scroll) {
    if (now - GS.lastScroll < GT.scrollThrottle) return null;
    GS.lastScroll = now;
    return { type: "scroll", gesture: g };
  }
  return null;
}

/* ---------- 日志 / 面板 ---------- */
function log(msg, cls) {

  ).join("");
}
function pill(el, on, text) {
  el.classList.toggle("on", !!on);
  el.classList.toggle("bad", on === false);
  if (text) el.textContent = text;
}
function renderHand() {

/* ---------- 光标 ---------- */
const cursorEl = $("cursor");
function setCursor(x, y) {
  S.cursor.x = clamp(x, 0, innerWidth);
  S.cursor.y = clamp(y, 0, innerHeight);
  cursorEl.style.left = S.cursor.x + "px";
  cursorEl.style.top = S.cursor.y + "px";

/* ---------- 光标轨迹 · 点亮方格 ---------- */
const GRID = 44, TRAIL_LIFE = 650;
const trailCanvas = $("trail");
const tctx = trailCanvas.getContext("2d");
const trailCells = new Map();
let trailColor = "#f5c518";
function readTrailColor() {
  const v = getComputedStyle(document.documentElement).getPropertyValue("--acc").trim();
  if (v) trailColor = v;
}
function sizeTrail() {
  trailCanvas.width = innerWidth;
  trailCanvas.height = innerHeight;
  trailCells.clear();
}
function lightCellAt(x, y) {
  trailCells.set(Math.floor(x / GRID) + "," + Math.floor(y / GRID), performance.now());
}
function drawTrail() {
  tctx.clearRect(0, 0, trailCanvas.width, trailCanvas.height);
  const now = performance.now();
  for (const [key, t] of trailCells) {
    const age = now - t;
    if (age > TRAIL_LIFE) { trailCells.delete(key); continue; }
    const k = 1 - age / TRAIL_LIFE;
    const i = key.indexOf(",");
    tctx.globalAlpha = 0.85 * k;
    tctx.strokeStyle = trailColor;
    tctx.lineWidth = 1.5;
    tctx.strokeRect((+key.slice(0, i)) * GRID, (+key.slice(i + 1)) * GRID, GRID, GRID);
  }
  tctx.globalAlpha = 1;
  requestAnimationFrame(drawTrail);
}
readTrailColor();
new MutationObserver(readTrailColor).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

/* ---------- WebGazer 眼动 ---------- */
let gInit = false, gx = 0, gy = 0;
let fpsT = performance.now(), fpsN = 0;

setInterval(() => {
  const now = performance.now();
  const fps = Math.round((fpsN * 1000) / Math.max(1, now - fpsT));
  $("pillFps").textContent = `眼动 ${fps} fps`;
  fpsN = 0;
  fpsT = now;
}, 1000);

function onGaze(data) {
  if (!data) { pill($("pillEye"), false, "视线 · 丢失"); return; }
  pill($("pillEye"), true, "视线 · OK");
  S.gazeCount++;
  fpsN++;

  const rx = clamp(data.x, 0, innerWidth);
  const ry = clamp(data.y, 0, innerHeight);

  if (!gInit) { gx = rx; gy = ry; setCursor(rx, ry); gInit = true; }
  gx += (rx - gx) * S.ema;
  gy += (ry - gy) * S.ema;

  let tx = gx, ty = gy, snapped = false;
  if (S.magnet) {
    let best = S.magnetR;
    for (const b of buttons) {
      if (b.el.style.display === "none") continue;
      const d = Math.hypot(gx - b.cx, gy - b.cy);
      if (d < best) { best = d; tx = b.cx; ty = b.cy; snapped = true; }
    }
  }
  const follow = snapped ? 0.42 : 0.20;
  setCursor(S.cursor.x + (tx - S.cursor.x) * follow, S.cursor.y + (ty - S.cursor.y) * follow);

  // 眼动精度采样：用原始坐标，不做平滑
  if (S.phase === "gaze-sample") S.samples.push({ x: data.x, y: data.y });
}

/* ---------- 摄像头：由 WebGazer 自己开流（单流单 video，不再复用同一条流） ---------- */
async function waitVideoReady(vf, timeoutMs = 3000) {
  const t0 = performance.now();
  // readyState >= 2 (HAVE_CURRENT_DATA) 才有可绘制帧；只等 videoWidth 会在首帧
  // 还没渲染出来时就误判为黑帧（drawImage 画出透明黑）。
  while (vf && !(vf.videoWidth && vf.readyState >= 2)) {
    if (performance.now() - t0 > timeoutMs) break;
    await new Promise(r => setTimeout(r, 50));
  }
}

async function bootEye() {
  if (typeof webgazer === "undefined") {
    log("WebGazer 未加载，请检查 controller-demo/vendor/webgazer/webgazer.js", "er");
    return false;
  }
  webgazer.setRegression("ridge");
  webgazer.showPredictionPoints(false);
  // 不能用 showVideoPreview(false)：display:none 的 video 会被浏览器暂停解码，
  // facemesh 检测不到脸，眼动永远没有输出。改为保留预览 + CSS 透明覆盖。
  webgazer.showVideoPreview(true);
  webgazer.showFaceOverlay(false);
  webgazer.showFaceFeedbackBox(false);
  webgazer.setGazeListener(onGaze);

  // 让 WebGazer 自己以 720p 开流。不要页面预先 getUserMedia 再复用同一条流：
  // 一条 MediaStream 被多个 <video>（#cam + #webgazerVideoFeed + tf.data.webcam）同时消费，
  // Chrome 会静默卡住预测循环（onGaze 永不触发 → 视线灯灰、眼动 0 fps）。
  // 1080p：吃满 Logitech 1080 的分辨率，脸部/瞳孔关键点更清晰 → 视线精度更高。
  // 若机器负载高、眼动 fps 掉到 ~15 以下，可回退 ideal 1280x720。
  webgazer.params.camConstraints = {
    video: { width: { ideal: 1920 }, height: { ideal: 1080 }, facingMode: "user" },
    audio: false,
  };
  try {
    await webgazer.begin();
  } catch (e) {
    log("WebGazer 启动失败：" + (e && e.message || e), "er");
    pill($("pillCam"), false, "摄像头 · 失败");
    return false;
  }
  cursorEl.classList.add("live");

  // WebGazer 内部 video：轮询等它真正出帧，再做黑帧校验，并交给手势识别
  const vf = document.getElementById("webgazerVideoFeed");
  handImg = vf;                 // MediaPipe 直接读 WebGazer 的 <video>（不是 canvas）
  await waitVideoReady(vf);
  if (!vf || !vf.videoWidth) {
    log("WebGazer 未拿到视频画面，眼动不可用", "er");
    pill($("pillCam"), false, "摄像头 · 无画面");
    return false;
  }
  // 首帧可能仍未渲染完，多采样几次再判黑帧，避免时序误判（只对真黑帧报警）
  let black = true;
  for (let i = 0; i < 3; i++) {
    if (!isBlackFrame(vf)) { black = false; break; }
    await new Promise(r => setTimeout(r, 200));
  }
  if (black) {
    log(`摄像头返回黑帧 ${vf.videoWidth}×${vf.videoHeight}：被其他应用占用或权限异常`, "er");
    pill($("pillCam"), false, "摄像头 · 黑帧");
    return false;
  }
  log(`摄像头就绪 ${vf.videoWidth}×${vf.videoHeight}`, "ok");
  pill($("pillCam"), true, `摄像头 · ${vf.videoWidth}×${vf.videoHeight}`);

  // 兜底诊断：begin() 后 3 秒若仍无任何视线输出，提示预测循环可能未启动
  const gc0 = S.gazeCount;
  setTimeout(() => {
    if (S.gazeCount === gc0) {
      log("3 秒内没有任何视线输出：WebGazer 预测循环可能未启动", "er");
      pill($("pillEye"), false, "视线 · 丢失");
    }
  }, 3000);

  return true;
}

function isBlackFrame(el) {
  try {
    let canvas = el;
    if (el.tagName === "VIDEO") {
      canvas = document.createElement("canvas");
      canvas.width = 64;
      canvas.height = 48;
      canvas.getContext("2d").drawImage(el, 0, 0, 64, 48);
    }
    const ctx = canvas.getContext("2d");
    const w = Math.min(48, canvas.width), h = Math.min(48, canvas.height);
    const d = ctx.getImageData(0, 0, w, h).data;
    let sum = 0;
    for (let i = 0; i < d.length; i += 4) sum += d[i] + d[i + 1] + d[i + 2];
    return d.length > 0 && sum / (d.length / 4) < 6;
  } catch (e) {
    return false;
  }
}

/* ---------- 手势识别 ---------- */
let recognizer = null, handImg = null, lastDetect = 0;

async function bootHand() {
  try {
    const vision = await import("../draw/vendor/vision/vision_bundle.mjs");
    const fileset = await vision.FilesetResolver.forVisionTasks("../draw/vendor/vision/wasm");
    const opts = (delegate) => ({
      baseOptions: { modelAssetPath: "../draw/models/gesture_recognizer.task", delegate },
      runningMode: "VIDEO",
      numHands: 1,
      minHandDetectionConfidence: 0.5,
      minHandPresenceConfidence: 0.5,
      minTrackingConfidence: 0.5,
    });
    try {
      recognizer = await vision.GestureRecognizer.createFromOptions(fileset, opts("GPU"));
    } catch (e) {
      log("GPU 初始化失败，回退 CPU：" + (e && e.message || e));
      recognizer = await vision.GestureRecognizer.createFromOptions(fileset, opts("CPU"));
    }
    // handImg 已在 bootEye 里设为 WebGazer 的 <video>（#webgazerVideoFeed）
    pill($("pillHand"), true, "手势 · 就绪");
    requestAnimationFrame(handLoop);
    return true;
  } catch (e) {
    log("手势模型加载失败：" + (e && e.message || e), "er");
    pill($("pillHand"), false, "手势 · 失败");
    return false;
  }
}

function srcW() { return handImg ? (handImg.videoWidth || handImg.width || 0) : 0; }
function srcH() { return handImg ? (handImg.videoHeight || handImg.height || 0) : 0; }

function handLoop(now) {
  requestAnimationFrame(handLoop);
  if (!recognizer || !handImg || !srcW()) return;
  if (now - lastDetect < 34) return;
  lastDetect = now;

  // recognizeForVideo 是同步 API（与 gesture-test / draw 一致），不能用 .then()
  let res;
  try {
    res = recognizer.recognizeForVideo(handImg, now);
  } catch (e) {
    log("识别出错：" + (e && e.message || e), "er");
    return;
  }
  const lm = res && res.landmarks && res.landmarks[0];
  S.lm = lm || null;
  if (lm) {
    S.lastHand = performance.now();
    const c = classifyHand(lm);
    S.raw = c.gesture;
    S.feat = c.feat;
    const ev = gsStep(c.gesture, performance.now());
    if (ev) onGesture(ev);
  } else {
    S.raw = "none";
    S.feat = null;
    gsReset();
  }
  renderHand();
}

function onGesture(ev) {
  const g = ev.gesture;
  const meta = G[g] || G.none;
  if (ev.type === "scroll") {
    log(`手势 ${meta.icon} ${meta.name} → 滚动 ${g === "scroll-up" ? "↑" : "↓"}`);
    return;
  }
  log(`手势 ${meta.icon} ${meta.name} → <b>${meta.act}</b>`);
  if (S.phase === "joint") judgeClick(g);
}

/* ---------- 13 点标定 ---------- */
const CALIB = [
  [0.10, 0.12], [0.50, 0.12], [0.90, 0.12],
  [0.10, 0.31],              [0.90, 0.31],
  [0.10, 0.50], [0.50, 0.50], [0.90, 0.50],
  [0.10, 0.69],              [0.90, 0.69],
  [0.10, 0.88], [0.50, 0.88], [0.90, 0.88],
];
let calibCount = 0;
const calibEl = $("calib");

function startCalib() {
  if (!S.running) return;
  calibCount = 0;
  $("calibBar").textContent = `已标定 0 / ${CALIB.length}`;
  calibEl.querySelectorAll(".cdot").forEach(n => n.remove());

  CALIB.forEach((p, i) => {
    const d = document.createElement("button");
    d.className = "cdot";
    d.textContent = String(i + 1);
    d.style.left = (p[0] * 100) + "%";
    d.style.top = (p[1] * 100) + "%";
    d.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const r = d.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      d.classList.add("done");
      calibCount++;
      $("calibBar").textContent = `已标定 ${calibCount} / ${CALIB.length}`;
      // 点击后延迟 300ms 等眼球稳定注视圆点，再连采 3 个等权样本（间隔 200ms）。
      // 用 ridge（等权回归）：每点 3 样本等权叠加，回归更稳；不用 weightedRidge，
      // 它按采集时间加权（最新样本权重 1），会和多采样冲突、让最后几个点主导回归。
      [300, 500, 700].forEach(delay => {
        setTimeout(() => webgazer.recordScreenPosition(cx, cy, "click"), delay);
      });
      if (calibCount >= CALIB.length) setTimeout(finishCalib, 800);
    });
    calibEl.appendChild(d);
  });

  calibEl.classList.add("show");
  log(`开始 ${CALIB.length} 点标定：点击后眼睛继续盯住圆点约 0.7 秒，等它打勾再移开`);
}

function finishCalib() {
  S.calibDone = true;
  $("btnGaze").disabled = false;
  $("btnJoint").disabled = false;
  $("stepHint").textContent = "标定完成。可先自由转动眼球看光标跟随，再运行量化测试。";
  log("标定完成 ✓", "ok");
  setTimeout(() => calibEl.classList.remove("show"), 500);
}

/* ---------- 目标点 ---------- */
function safeRect() {
  // 避开四周面板
  return { x0: 300, y0: 110, x1: Math.max(360, innerWidth - 340), y1: Math.max(200, innerHeight - 60) };
}
function safePoint(pad) {
  const r = safeRect();
  const p = pad || 110;
  return {
    x: r.x0 + p + Math.random() * Math.max(1, (r.x1 - r.x0) - p * 2),
    y: r.y0 + p + Math.random() * Math.max(1, (r.y1 - r.y0) - p * 2),
  };
}

const targetEl = $("target");
function showTarget(p) {
  targetEl.style.display = "block";
  targetEl.style.left = p.x + "px";
  targetEl.style.top = p.y + "px";
}
function hideTarget() { targetEl.style.display = "none"; }

/* ---------- 测试 1：眼动精度 ---------- */
function startGazeTest() {
  if (!S.calibDone) { log("请先完成标定", "er"); return; }
  S.gaze = { idx: 0, total: 12, errs: [], hit: 0, empty: 0 };
  $("btnGaze").disabled = true;
  $("btnJoint").disabled = true;
  buttons.forEach(b => { b.el.style.display = "none"; b.el.classList.remove("target", "ok", "bad"); });
  log("开始眼动精度测试（12 个目标）");
  nextGazeTarget();
}

function nextGazeTarget() {
  if (S.gaze.idx >= S.gaze.total) { finishGazeTest(); return; }
  const p = safePoint(120);
  S.target = p;
  S.gaze.idx++;
  showTarget(p);
  $("hint").textContent = `眼动测试 ${S.gaze.idx}/${S.gaze.total} —— 盯住蓝色圆点`;
  S.phase = "gaze-settle";

  setTimeout(() => {
    if (S.phase !== "gaze-settle") return;
    S.samples = [];
    S.phase = "gaze-sample";
  }, 400);

  setTimeout(() => {
    if (S.phase !== "gaze-sample") return;
    S.phase = "gaze-gap";
    evaluateGazePoint();
  }, 400 + 1200);
}

function evaluateGazePoint() {
  const s = S.samples || [];
  hideTarget();
  if (!s.length) {
    S.gaze.empty++;
    log(`目标 ${S.gaze.idx}：无视线样本（未检测到脸）`, "er");
  } else {
    const mx = s.reduce((a, b) => a + b.x, 0) / s.length;
    const my = s.reduce((a, b) => a + b.y, 0) / s.length;
    const d = Math.hypot(mx - S.target.x, my - S.target.y);
    S.gaze.errs.push(d);
    if (d < 70) S.gaze.hit++;
    log(`目标 ${S.gaze.idx}：偏差 ${Math.round(d)}px ${d < 70 ? "✓" : ""}`, d < 70 ? "ok" : "");
  }
  renderResults();
  setTimeout(nextGazeTarget, 350);
}

function finishGazeTest() {
  S.phase = "idle";
  $("btnGaze").disabled = false;
  $("btnJoint").disabled = false;
  buttons.forEach(b => { b.el.style.display = ""; });
  const e = S.gaze.errs;
  const avg = e.length ? e.reduce((a, b) => a + b, 0) / e.length : 0;
  log(`眼动测试完成：平均偏差 ${Math.round(avg)}px，命中 ${S.gaze.hit}/${S.gaze.total}`, "ok");
  $("hint").textContent = "眼动测试完成，可运行眼-手联合点击";
  renderResults();
}

/* ---------- 四按钮 + 测试 2：眼-手联合点击 ---------- */
const BTN_DEFS = [
  { key: "fist", label: "确认", sub: "✊ 握拳", icon: "✊" },
  { key: "thumb", label: "返回", sub: "👍 拇指朝上", icon: "👍" },
  { key: "point", label: "主页", sub: "☝️ 食指", icon: "☝️" },
  { key: "two", label: "菜单", sub: "✌️ 二指", icon: "✌️" },
];
const buttons = [];

function buildButtons() {
  BTN_DEFS.forEach((def) => {
    const el = document.createElement("div");
    el.className = "gbtn";
    el.innerHTML = `<span class="ic">${def.icon}</span><span class="nm">${def.label}</span><span class="ac">${def.sub}</span>`;
    document.body.appendChild(el);
    buttons.push({ ...def, el, x: 0, y: 0, w: 190, h: 112, cx: 0, cy: 0 });
  });
  layoutButtons();
}

function layoutButtons() {
  const W = innerWidth, H = innerHeight;
  const gap = 48, bw = 190, bh = 112;
  const totalW = bw * 2 + gap, totalH = bh * 2 + gap;
  const x0 = Math.round(W / 2 - totalW / 2);
  const y0 = Math.round(H / 2 - totalH / 2);
  buttons.forEach((b, i) => {
    b.x = x0 + (i % 2) * (bw + gap);
    b.y = y0 + Math.floor(i / 2) * (bh + gap);
    b.w = bw; b.h = bh;
    b.cx = b.x + bw / 2;
    b.cy = b.y + bh / 2;
    b.el.style.left = b.x + "px";
    b.el.style.top = b.y + "px";
    b.el.style.width = bw + "px";
    b.el.style.height = bh + "px";
  });
}

function btnAt(x, y) {
  for (const b of buttons) {
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b;
  }
  return null;
}

function startJointTest() {
  if (!S.calibDone) { log("请先完成标定", "er"); return; }
  S.joint = { round: 0, total: 10, ok: 0, bad: 0, timeout: 0, miss: 0, times: [], t0: 0, target: null };
  $("btnGaze").disabled = true;
  $("btnJoint").disabled = true;
  buttons.forEach(b => { b.el.style.display = ""; b.el.classList.remove("target", "ok", "bad"); });
  log("开始眼-手联合点击（10 轮）：看准高亮按钮 → 握拳确认");
  nextJointRound();
}

function nextJointRound() {
  if (S.joint.round >= S.joint.total) { finishJointTest(); return; }
  buttons.forEach(b => b.el.classList.remove("target", "ok", "bad"));
  const t = buttons[Math.floor(Math.random() * buttons.length)];
  S.joint.round++;
  S.joint.target = t;
  t.el.classList.add("target");
  S.joint.t0 = performance.now();
  S.phase = "joint";
  $("hint").textContent = `联合测试 ${S.joint.round}/${S.joint.total} —— 看向「${t.label}」并握拳`;

  clearTimeout(S.joint.timer);
  S.joint.timer = setTimeout(() => {
    if (S.phase !== "joint") return;
    S.joint.timeout++;
    log(`第 ${S.joint.round} 轮超时（15s）`, "er");
    finishJointRound();
  }, 15000);
}

function judgeClick(g) {
  if (g !== "fist") {
    log(`（${G[g] ? G[g].name : g} 不是确认手势，忽略）`);
    return;
  }
  const b = btnAt(S.cursor.x, S.cursor.y);
  const now = performance.now();
  if (!b) {
    S.joint.miss++;
    log(`  空点：光标不在按钮上 (${Math.round(S.cursor.x)},${Math.round(S.cursor.y)})`, "er");
    return;
  }
  if (b === S.joint.target) {
    S.joint.ok++;
    S.joint.times.push(now - S.joint.t0);
    b.el.classList.add("ok");
    b.el.classList.remove("target");
    log(`  ✓ 命中「${b.label}」 ${Math.round(now - S.joint.t0)}ms`, "ok");
    finishJointRound();
  } else {
    S.joint.bad++;
    b.el.classList.add("bad");
    log(`  ✗ 误点「${b.label}」（目标「${S.joint.target.label}」）`, "er");
    // 误点不结束本轮，允许重试
  }
  renderResults();
}

function finishJointRound() {
  clearTimeout(S.joint.timer);
  S.phase = "joint-gap";
  renderResults();
  setTimeout(nextJointRound, 800);
}

function finishJointTest() {
  S.phase = "idle";
  $("btnGaze").disabled = false;
  $("btnJoint").disabled = false;
  buttons.forEach(b => b.el.classList.remove("target", "ok", "bad"));
  log(`联合测试完成：命中 ${S.joint.ok}/${S.joint.total}，误点 ${S.joint.bad}，超时 ${S.joint.timeout}`, "ok");
  $("hint").textContent = "联合测试完成";
  renderResults();
}

/* ---------- 结果渲染 ---------- */
function p90(arr) {
  if (!arr.length) return 0;
  const s = [...arr].sort((a, b) => a - b);
  return s[Math.min(s.length - 1, Math.floor(s.length * 0.9))];
}

function renderResults() {
  const g = S.gaze, j = S.joint;
  const avg = g.errs.length ? g.errs.reduce((a, b) => a + b, 0) / g.errs.length : 0;
  const hitRate = g.total ? Math.round((g.hit / g.total) * 100) : 0;
  const jAvg = j.times.length ? j.times.reduce((a, b) => a + b, 0) / j.times.length : 0;

  $("res").innerHTML = `
    <div style="color:#7d8ea8;font-size:11px;margin-bottom:2px">眼动精度（${g.idx}/${g.total} 点）</div>
    <table>
      <tr><td>平均偏差</td><td>${g.errs.length ? Math.round(avg) + " px" : "—"}</td></tr>
      <tr><td>P90 偏差</td><td>${g.errs.length ? Math.round(p90(g.errs)) + " px" : "—"}</td></tr>
      <tr><td>命中率（&lt;70px）</td><td>${g.errs.length ? hitRate + " %" : "—"}</td></tr>
      <tr><td>无样本点</td><td>${g.empty}</td></tr>
    </table>
    <div style="color:#7d8ea8;font-size:11px;margin:10px 0 2px">眼-手联合（${j.round}/${j.total} 轮）</div>
    <table>
      <tr><td>命中</td><td>${j.ok}</td></tr>
      <tr><td>误点</td><td>${j.bad}</td></tr>
      <tr><td>空点</td><td>${j.miss}</td></tr>
      <tr><td>超时</td><td>${j.timeout}</td></tr>
      <tr><td>平均耗时</td><td>${j.times.length ? Math.round(jAvg) + " ms" : "—"}</td></tr>
    </table>
    <div class="note">眼动误差 ≈ 70px 以内可视为“能指向”；联合命中率 ≥ 80% 说明“看+确认”可用。</div>
  `;
}

/* ---------- 启动 ---------- */
async function boot() {
  $("btnBoot").disabled = true;
  log("正在启动眼动（WebGazer 开摄像头）…");
  const okEye = await bootEye();
  if (!okEye) {
    $("btnBoot").disabled = false;
    $("hint").textContent = "摄像头/眼动不可用：请检查权限与占用";
    $("stepHint").textContent = "眼动启动失败（摄像头未就绪）。";
    return;
  }
  log("正在加载手势模型…");
  const okHand = await bootHand();
  S.running = true;
  $("btnCalib").disabled = false;
  $("btnGaze").disabled = false;
  $("stepHint").textContent = okHand
    ? "已就绪：先做 13 点标定。"
    : "眼动已就绪，但手势模型加载失败（仍可测眼动精度）。";
  log(okHand ? "全部就绪 ✓" : "手势不可用，仅眼动", okHand ? "ok" : "er");
  $("hint").textContent = "眼动控光标 · 手势发命令";
}

/* ---------- 事件绑定 ---------- */
$("btnBoot").addEventListener("click", boot);
$("btnCalib").addEventListener("click", startCalib);
$("btnGaze").addEventListener("click", startGazeTest);
$("btnJoint").addEventListener("click", startJointTest);
$("calibClose").addEventListener("click", () => calibEl.classList.remove("show"));
$("btnClearLog").addEventListener("click", () => { S.logs = []; $("log").innerHTML = ""; });

$("optMagnet").addEventListener("change", (e) => { S.magnet = e.target.checked; });
$("optEma").addEventListener("input", (e) => { S.ema = parseFloat(e.target.value) / 100; });

$("btnExport").addEventListener("click", () => {
  const data = {
    ts: new Date().toISOString(),
    gt: GT,
    gaze: { total: S.gaze.total, idx: S.gaze.idx, errs: S.gaze.errs, hit: S.gaze.hit, empty: S.gaze.empty },
    joint: { total: S.joint.total, ok: S.joint.ok, bad: S.joint.bad, miss: S.joint.miss, timeout: S.joint.timeout, times: S.joint.times },
    logs: S.logs.slice(0, 100),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "dual-control-test.json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  log("已导出结果 JSON");
});

window.addEventListener("resize", () => { layoutButtons(); sizeTrail(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") calibEl.classList.remove("show");
  // 调试：按 1-4 模拟手势，方便无摄像头时验证流程
  const map = { "1": "fist", "2": "thumb", "3": "point", "4": "two" };
  if (map[e.key] && e.altKey) { onGesture({ type: "discrete", gesture: map[e.key] }); }
});

/* ---------- 启动时构建 ---------- */
buildButtons();
sizeTrail();
requestAnimationFrame(drawTrail);
renderResults();
log("页面就绪。点击右上「启动摄像头 + 模型」。");
</script>
</body>
</html>
